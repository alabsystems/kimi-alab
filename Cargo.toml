[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
authors = ["Andrew Yates"]
repository = "https://github.com/alabsystems/kimi-alab"

# The one tool atpkg shims from this repo (aterm atpkg-publish: a harness ships exactly its
# one binary, and its row in programs::PROGRAMS names the same tool).
[workspace.metadata.atpkg]
expose = ["kimi-alab"]

[package]
name = "kimi-alab"
description = "ALab harness for Moonshot AI's Kimi Code CLI: runs the unmodified vendor `kimi` from the atpkg store as its child and moves it onto a newer vendor build underneath itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kimi_alab"
path = "src/lib.rs"

[[bin]]
name = "kimi-alab"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process", "param", "system", "termios"] }
signal-hook = { version = "0.4", default-features = false }
serde_json = "1"

[dev-dependencies]
rustix = { version = "1", features = ["process", "pty", "fs"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
