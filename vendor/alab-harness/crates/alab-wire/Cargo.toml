#
# alab-wire: an ALab harness's link to aterm. The wire, the contract-3 claim
# with its guards, the link's state machine, aterm's exit judgement and the
# crash ladder, and (feature `fake`) a fake aterm for consumers' tests. No
# process supervision: nothing here forks, execs or signals a vendor.

[package]
name = "alab-wire"
description = "An ALab harness's link to aterm: wire, claim, link state machine, exit judgement and crash ladder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The fake aterm (`alab_wire::fake`), for a consumer's own tests. This crate's
# own tests always have it.
fake = []

[dependencies]
libc.workspace = true

[lints]
workspace = true
