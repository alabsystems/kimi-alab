#
# alab-policy's disallowed methods and types. Clippy reads only the nearest clippy.toml, so this
# file holds every row that binds this crate.
#
# * Rows from aterm: every std and core row of aterm's clippy.toml, word for word, so the code
#   moved out of aterm's supervisor loses no lint it had there. Their reasons name aterm's own
#   doors (aterm_uds, aterm_durable, ...), which this crate cannot reach: it has no dependencies,
#   so here each row simply refuses.
# * No input or output: aterm's census stops seeing this code once it sits under aterm's
#   vendor/, so the crate enforces the rule itself. Clippy takes no module wildcard, so each std
#   module the rule closes is listed whole: every free function of std::fs and std::process,
#   std::env's var readers, and every type of std::fs, std::process and std::net; plus the clocks
#   (Instant::now, SystemTime::now) and sleep. A caller passes a reading or a time as data.
#   The rest of what aterm's census (its supervise-fx rule) refused in these files is listed too,
#   so the move loses none of it: the clock read by .elapsed() and the sleeps sleep_until and
#   park_timeout; a delivery from another thread waited on by try_recv or recv_timeout; and the
#   disk reached through a std::path::Path method (exists, metadata, read_dir and the like). So
#   is the rest of std::env that reads or changes the process (args, the current, home and temp
#   directories, the executable's path); set_var and remove_var are unsafe in edition 2024, which
#   forbid(unsafe_code) already refuses, and split_paths, join_paths and consts only compute.
#   std::process's ExitCode and Termination stay open: they only say how a main ends, and the
#   test harness's generated main names ExitCode, so its ban refuses every test target.
#   lib.rs adds #![forbid(unsafe_code)].
